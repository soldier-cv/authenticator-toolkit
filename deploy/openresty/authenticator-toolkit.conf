# 本文件是宿主反向代理站点配置的归档副本
# 权威路径（实际生效）：/opt/1panel/www/conf.d/authenticator-toolkit.conf
# 生效方式：sudo cp 到权威路径后 docker exec openresty nginx -t && docker exec openresty nginx -s reload
# 说明：openresty 容器为 host 网络，故可直接代理宿主回环 127.0.0.1:5081
# Authenticator Toolkit 对外入口（宿主 5080）
# 上游：容器仅绑宿主回环 127.0.0.1:5081（容器端口不再对任何网络接口裸奔）
# 鉴权：应用层 Basic Auth（未配置口令时容器拒绝启动，fail-closed）；反代不叠加第二道口令，避免双弹框
# ACL：仅放行 ZeroTier 网段 100.64.0.0/10 与回环，其它来源 403
server {
    listen 5080;
    listen [::]:5080;
    server_name 100.64.0.88;

    allow 100.64.0.0/10;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    # 与容器 MAX_CONTENT_LENGTH(16MB) 对齐，留余量（默认 1m 会让二维码图片上传 413）
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}
