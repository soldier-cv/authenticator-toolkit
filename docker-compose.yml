version: '3.8'
services:
  authenticator-toolkit:
    build: .
    container_name: authenticator-toolkit
    ports:
      - "5080:5000"
    restart: unless-stopped
    volumes:
      - /data/authenticator-toolkit:/data
    environment:
      - PORT=5000
      - RATE_LIMIT_DAILY=50
      - RATE_LIMIT_DB=/data/usage.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
