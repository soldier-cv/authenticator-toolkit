version: '3.8'
services:
  authenticator-toolkit:
    build: .
    container_name: authenticator-toolkit
    # 宿主 5080 留给反向代理对外监听 (http://100.64.0.88:5080)，容器端口回环绑定到 127.0.0.1:5081 避免与反代监听冲突
    ports:
      - "127.0.0.1:5081:5000"
    restart: unless-stopped
    env_file:
      - /home/xl/.hermes/.secrets/authenticator-toolkit.env
    volumes:
      - /data/authenticator-toolkit:/data
    environment:
      - PORT=5000
      - RATE_LIMIT_DAILY=50
      - RATE_LIMIT_DB=/data/usage.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
