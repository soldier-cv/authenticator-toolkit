<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google 身份验证器密钥提取</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            /* Morandi palette - muted, warm, no purple/pink */
            --md-primary: #7A8B6F;        /* sage green */
            --md-on-primary: #FFFFFF;
            --md-primary-container: #D4E4C8;
            --md-on-primary-container: #2A3622;
            --md-secondary: #A89D90;       /* warm taupe */
            --md-on-secondary: #FFFFFF;
            --md-secondary-container: #EDE4D8;
            --md-on-secondary-container: #3A3228;
            --md-tertiary: #7B8FA0;        /* dusty blue-gray */
            --md-on-tertiary: #FFFFFF;
            --md-tertiary-container: #D4E4F0;
            --md-on-tertiary-container: #283440;
            --md-surface: #F6F1EB;
            --md-on-surface: #3C3832;
            --md-on-surface-variant: #6B6560;
            --md-surface-container-low: #EDE8E2;
            --md-surface-container: #E8E2DC;
            --md-surface-container-high: #DDD7D0;
            --md-outline: #A09A93;
            --md-outline-variant: #C8C2BA;
            --md-error: #B8614E;
            --md-on-error: #FFFFFF;
            --md-error-container: #F5D5CC;
            --md-on-error-container: #5C1F10;
            --md-success: #6B8F5E;
            --md-shadow: rgba(60, 56, 50, 0.08);

            /* M3 shape */
            --md-shape-s: 8px;
            --md-shape-m: 12px;
            --md-shape-l: 16px;
            --md-shape-xl: 28px;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            background: var(--md-surface);
            color: var(--md-on-surface);
            min-height: 100vh;
            padding: 1.5rem;
            line-height: 1.5;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem 1rem;
        }
        .header-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            filter: grayscale(20%);
        }
        h1 {
            font-size: 1.65rem;
            font-weight: 600;
            color: var(--md-on-surface);
            letter-spacing: -0.02em;
        }
        .subtitle {
            color: var(--md-on-surface-variant);
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        /* M3 Cards (filled tonal) */
        .card {
            background: var(--md-surface-container-low);
            border-radius: var(--md-shape-l);
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: 0 1px 3px var(--md-shadow);
        }

        /* M3 Segmented Button (tabs) */
        .tab-nav {
            display: flex;
            gap: 0;
            margin-bottom: 1.5rem;
            border-radius: var(--md-shape-xl);
            overflow: hidden;
            border: 1px solid var(--md-outline);
            background: var(--md-surface-container-low);
        }
        .tab-btn {
            flex: 1;
            padding: 0.7rem 1rem;
            background: transparent;
            border: none;
            border-right: 1px solid var(--md-outline);
            color: var(--md-on-surface);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            position: relative;
        }
        .tab-btn:last-child { border-right: none; }
        .tab-btn:hover {
            background: var(--md-surface-container);
        }
        .tab-btn.active {
            background: var(--md-secondary-container);
            color: var(--md-on-secondary-container);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Upload Zone */
        .upload-zone {
            border: 2px dashed var(--md-outline-variant);
            border-radius: var(--md-shape-l);
            padding: 2.5rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            background: var(--md-surface-container);
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--md-primary);
            background: var(--md-primary-container);
        }
        .upload-zone input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }
        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            opacity: 0.85;
        }
        .upload-text { color: var(--md-on-surface-variant); font-size: 0.9rem; }
        .upload-text strong { color: var(--md-primary); font-weight: 600; }

        /* Textarea */
        .uri-input {
            width: 100%;
            min-height: 100px;
            background: var(--md-surface);
            border: 1.5px solid var(--md-outline-variant);
            border-radius: var(--md-shape-m);
            color: var(--md-on-surface);
            padding: 0.875rem 1rem;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 0.85rem;
            resize: vertical;
            transition: border-color 0.2s;
        }
        .uri-input::placeholder { color: var(--md-outline); }
        .uri-input:focus {
            outline: none;
            border-color: var(--md-primary);
            border-width: 2px;
            padding: calc(0.875rem - 0.5px) calc(1rem - 0.5px);
        }

        /* M3 Filled Button */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.75rem;
            background: var(--md-primary);
            color: var(--md-on-primary);
            border: none;
            border-radius: var(--md-shape-xl);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 1rem;
            transition: box-shadow 0.2s, opacity 0.2s;
            letter-spacing: 0.01em;
        }
        .btn:hover {
            box-shadow: 0 2px 8px rgba(122, 139, 111, 0.35);
        }
        .btn:active { opacity: 0.9; }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Results */
        .results { margin-top: 1.25rem; }

        .results-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding: 0 0.25rem;
        }
        .results-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--md-on-surface);
        }

        /* Account Card (elevated) */
        .account-card {
            background: var(--md-surface-container-low);
            border: 1px solid var(--md-outline-variant);
            border-radius: var(--md-shape-m);
            padding: 1.25rem;
            margin-bottom: 0.75rem;
            transition: box-shadow 0.2s;
        }
        .account-card:hover {
            box-shadow: 0 2px 8px var(--md-shadow);
        }
        .account-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .account-name {
            font-weight: 600;
            font-size: 1rem;
            color: var(--md-on-surface);
        }
        .account-badge {
            padding: 0.2rem 0.65rem;
            background: var(--md-tertiary-container);
            color: var(--md-on-tertiary-container);
            border-radius: var(--md-shape-s);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.03em;
        }
        .account-issuer {
            color: var(--md-on-surface-variant);
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
        }

        /* Secret Key container */
        .secret-container {
            background: var(--md-surface-container);
            border-radius: var(--md-shape-m);
            padding: 0.875rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .secret-label {
            font-size: 0.75rem;
            color: var(--md-on-surface-variant);
            margin-bottom: 0.2rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 500;
        }
        .secret-value {
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 1.05rem;
            color: var(--md-success);
            letter-spacing: 1.5px;
            word-break: break-all;
            font-weight: 600;
        }

        /* M3 Tonal Button (copy) */
        .copy-btn {
            background: var(--md-secondary-container);
            color: var(--md-on-secondary-container);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: var(--md-shape-s);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .copy-btn:hover { opacity: 0.85; }
        .copy-btn.copied {
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
        }

        /* Account details grid */
        .account-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.5rem;
            margin-top: 0.75rem;
            font-size: 0.8rem;
        }
        .detail-item { color: var(--md-on-surface-variant); }
        .detail-item span { color: var(--md-on-surface); font-weight: 500; }

        /* Error */
        .error {
            background: var(--md-error-container);
            border: 1px solid var(--md-error);
            border-radius: var(--md-shape-m);
            padding: 1rem;
            color: var(--md-on-error-container);
            margin-top: 0.75rem;
            font-size: 0.9rem;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--md-on-surface-variant);
        }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--md-outline-variant);
            border-top-color: var(--md-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 0.75rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .preview {
            max-width: 180px;
            max-height: 180px;
            margin: 1rem auto;
            border-radius: var(--md-shape-m);
            display: none;
            box-shadow: 0 2px 8px var(--md-shadow);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 2rem;
            padding: 1rem;
            color: var(--md-outline);
            font-size: 0.8rem;
        }
        .footer a {
            color: var(--md-primary);
            text-decoration: none;
            font-weight: 500;
        }
        .footer a:hover { text-decoration: underline; }

        /* Responsive */
        @media (max-width: 480px) {
            body { padding: 1rem; }
            .card { padding: 1.25rem; }
            .upload-zone { padding: 2rem 1.25rem; }
            h1 { font-size: 1.35rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">🔑</div>
            <h1>Google 身份验证器密钥提取</h1>
            <p class="subtitle">从 Google 身份验证器二维码中提取 TOTP 密钥</p>
        </div>

        <div class="card">
            <div class="tab-nav">
                <button class="tab-btn active" onclick="switchTab('upload')">📷 上传二维码</button>
                <button class="tab-btn" onclick="switchTab('uri')">📋 粘贴 URI</button>
            </div>

            <!-- Upload Tab -->
            <div id="tab-upload" class="tab-content active">
                <div class="upload-zone" id="uploadZone">
                    <input type="file" id="fileInput" accept="image/*">
                    <div class="upload-icon">📤</div>
                    <p class="upload-text">
                        <strong>点击上传</strong> 或拖拽文件到此处<br>
                        <small>支持 PNG、JPG、BMP、WebP 格式（最大 16MB）</small>
                    </p>
                </div>
                <img id="preview" class="preview" alt="二维码预览">
                <button class="btn" id="uploadBtn" onclick="decodeImage()" disabled>
                    🔍 提取密钥
                </button>
            </div>

            <!-- URI Tab -->
            <div id="tab-uri" class="tab-content">
                <textarea class="uri-input" id="uriInput"
                    placeholder="粘贴 otpauth-migration://offline?data=... 格式的 URI 到此处"></textarea>
                <button class="btn" id="uriBtn" onclick="decodeUri()">
                    🔍 提取密钥
                </button>
            </div>
        </div>

        <!-- Results -->
        <div id="results" class="results"></div>

        <div class="footer">
            基于 <a href="https://github.com/soldier-cv/google-authenticator-exporter" target="_blank">
                soldier-cv/google-authenticator-exporter</a> · 莫兰迪色系设计
        </div>
    </div>

    <script>
        let selectedFile = null;

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }

        // Global Ctrl+V support
        document.addEventListener('paste', (e) => {
            const uriInput = document.getElementById('uriInput');
            const isUriFocused = (document.activeElement === uriInput);

            const items = e.clipboardData?.items;
            if (!items) return;

            // Check for image in clipboard
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    e.preventDefault();
                    const file = item.getAsFile();
                    if (file) {
                        selectedFile = file;
                        fileInput.files = createFileList(file);
                        showPreview(file);
                        switchTabByName('upload');
                        decodeImage();
                    }
                    return;
                }
            }

            // Check for text in clipboard
            for (const item of items) {
                if (item.type === 'text/plain') {
                    e.preventDefault();
                    item.getAsString((text) => {
                        const trimmed = text.trim();
                        if (isUriFocused) {
                            const start = uriInput.selectionStart;
                            const end = uriInput.selectionEnd;
                            uriInput.value = uriInput.value.substring(0, start) + trimmed + uriInput.value.substring(end);
                            uriInput.selectionStart = uriInput.selectionEnd = start + trimmed.length;
                        } else {
                            uriInput.value = trimmed;
                            switchTabByName('uri');
                        }
                    });
                    return;
                }
            }
        });

        function switchTabByName(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            const tabBtns = document.querySelectorAll('.tab-btn');
            tabBtns.forEach(btn => {
                if ((tab === 'upload' && btn.textContent.includes('Upload')) ||
                    (tab === 'uri' && btn.textContent.includes('Paste'))) {
                    btn.classList.add('active');
                }
            });
            document.getElementById('tab-' + tab).classList.add('active');
        }

        function createFileList(file) {
            const dt = new DataTransfer();
            dt.items.add(file);
            return dt.files;
        }

        // File upload handling
        const fileInput = document.getElementById('fileInput');
        const uploadZone = document.getElementById('uploadZone');
        const preview = document.getElementById('preview');
        const uploadBtn = document.getElementById('uploadBtn');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                showPreview(selectedFile);
            }
        });

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files[0]) {
                selectedFile = e.dataTransfer.files[0];
                fileInput.files = e.dataTransfer.files;
                showPreview(selectedFile);
            }
        });

        function showPreview(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                uploadBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        async function decodeImage() {
            if (!selectedFile) return;

            const btn = document.getElementById('uploadBtn');
            const results = document.getElementById('results');

            btn.disabled = true;
            btn.textContent = '⏳ Processing...';
            results.innerHTML = '<div class="loading"><div class="spinner"></div><p>Decoding QR code...</p></div>';

            const formData = new FormData();
            formData.append('qr_image', selectedFile);

            try {
                const response = await fetch('/decode', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.error) {
                    results.innerHTML = '<div class="error">❌ ' + escapeHtml(data.error) + '</div>';
                } else {
                    renderResults(data.accounts || data.otp_parameters);
                }
            } catch (err) {
                results.innerHTML = '<div class="error">❌ 网络错误: ' + escapeHtml(err.message) + '</div>';
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 提取密钥';
            }
        }

        async function decodeUri() {
            const uri = document.getElementById('uriInput').value.trim();
            if (!uri) return;

            const btn = document.getElementById('uriBtn');
            const results = document.getElementById('results');

            btn.disabled = true;
            btn.textContent = '⏳ Processing...';
            results.innerHTML = '<div class="loading"><div class="spinner"></div><p>Decoding URI...</p></div>';

            const formData = new FormData();
            formData.append('uri', uri);

            try {
                const response = await fetch('/decode', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.error) {
                    results.innerHTML = '<div class="error">❌ ' + escapeHtml(data.error) + '</div>';
                } else {
                    renderResults(data.accounts || data.otp_parameters);
                }
            } catch (err) {
                results.innerHTML = '<div class="error">❌ 网络错误: ' + escapeHtml(err.message) + '</div>';
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 提取密钥';
            }
        }

        function renderResults(accounts) {
            const results = document.getElementById('results');

            if (!accounts || accounts.length === 0) {
                results.innerHTML = '<div class="error">未在二维码中找到账号信息</div>';
                return;
            }

            let html = '<div class="card"><div class="results-header"><h2>✅ 发现 ' + accounts.length + ' 个账号</h2></div>';

            accounts.forEach((acct, index) => {
                const secret = acct.secret_base32 || acct.totpSecret || '';
                const name = acct.name || '未知账号';
                const issuer = acct.issuer || '未知发行方';
                const type = acct.type || 'TOTP';
                const algorithm = acct.algorithm || 'SHA1';
                const digits = acct.digits || 6;

                html += `
                    <div class="account-card">
                        <div class="account-header">
                            <span class="account-name">${escapeHtml(name)}</span>
                            <span class="account-badge">${escapeHtml(type)}</span>
                        </div>
                        <div class="account-issuer">${escapeHtml(issuer)}</div>
                        <div class="secret-container">
                            <div>
                                <div class="secret-label">密钥</div>
                                <div class="secret-value" id="secret-${index}">${escapeHtml(secret)}</div>
                            </div>
                            <button class="copy-btn" onclick="copySecret(${index}, this)">📋 复制</button>
                        </div>
                        <div class="account-details">
                            <div class="detail-item">算法: <span>${escapeHtml(algorithm)}</span></div>
                            <div class="detail-item">位数: <span>${digits}</span></div>
                            ${acct.counter ? '<div class="detail-item">计数器: <span>' + acct.counter + '</span></div>' : ''}
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            results.innerHTML = html;
        }

        function copySecret(index, btn) {
            const secretEl = document.getElementById('secret-' + index);
            const secret = secretEl.textContent;

            navigator.clipboard.writeText(secret).then(() => {
                btn.textContent = '✅ Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 复制';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
